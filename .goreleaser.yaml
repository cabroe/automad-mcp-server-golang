# GoReleaser configuration — builds cross-platform binaries and publishes a
# GitHub release on every pushed `v*` tag. See .github/workflows/release.yml.
# Validate locally with: goreleaser check  (and: goreleaser release --snapshot --clean)
version: 2

project_name: automad-mcp-server

before:
  hooks:
    - go mod tidy

builds:
  - id: automad-mcp-server
    main: ./cmd/automad-mcp-server
    binary: automad-mcp-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Aligns with main.version (see cmd/automad-mcp-server/main.go) and the CI
    # build ldflags, so `automad-mcp-server` reports the release tag.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - SKILL.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  # Tags like v1.2.3-rc.1 are published as GitHub pre-releases automatically.
  prerelease: auto
  footer: |
    ## Install

    Install the latest release with Go:

    ```bash
    go install github.com/cabroe/automad-mcp-server-golang/cmd/automad-mcp-server@{{ .Tag }}
    ```

    Or download a prebuilt binary for your platform from the assets below — no Go toolchain required.
