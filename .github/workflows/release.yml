name: Release

# Publishes a GitHub release with cross-platform binaries whenever a semver tag
# is pushed. Tag and push to cut a release:
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# `go install ...@latest` starts resolving to the newest tag as soon as one exists.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so GoReleaser can build the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
